# ═══════════════════════════════════════════════════════════════════════════
# 12. CI/CD E GITOPS: DALLA COMMIT AL CLUSTER
# Versione: GitLab CI · BuildKit · Trivy · Helm 4 · Argo CD 3
# Livello: 5 — Produzione
# ═══════════════════════════════════════════════════════════════════════════
# Due modelli di deploy, da saper confrontare:
#
#   PUSH  la pipeline ha le credenziali del cluster e fa `helm upgrade`.
#         Semplice; ma la CI è un punto con accesso a produzione, e se
#         qualcuno cambia il cluster a mano nessuno se ne accorge.
#   PULL  (GitOps) la pipeline aggiorna un repo di configurazione; un
#         agente NEL cluster (Argo CD, Flux) lo osserva e riconcilia.
#         Git è la fonte di verità, ogni cambio è una commit revisionata,
#         il drift si vede e si corregge, il rollback è un `git revert`.
#
# PIPELINE (questo file = .gitlab-ci.yml del repo dell'APP)
#   lint → test → build (immagine con tag = SHA) → scan → push
#        → aggiorna il repo di config (staging, automatico)
#        → promozione a prod (manuale, stessa immagine, nessuna rebuild)
#
# PRINCIPI
#   • build once, deploy many: lo stesso digest in ogni ambiente
#   • tag immutabili (SHA o SemVer), mai :latest in un manifest
#   • la pipeline fallisce su CVE critiche, non le segnala e basta
#   • segreti dalla CI (variabili protette/masked) o da OIDC, non nel repo
#   • prod solo da branch protetto, con approvazione (environment)
#
# LAB SU UBUNTU senza GitLab: gli stessi passi a mano
#   docker build -t localhost:5000/eco:$(git rev-parse --short HEAD) .
#   docker run --rm aquasec/trivy:latest image --severity CRITICAL --exit-code 1 <immagine>
#   helm upgrade --install eco ./eco --set image.tag=<sha> --rollback-on-failure --wait
#   Argo CD sul minikube:
#     kubectl create ns argocd
#     kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#     kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
#     kubectl -n argocd port-forward svc/argocd-server 8443:443

stages: [lint, test, build, scan, deploy-staging, deploy-prod]

variables:
  IMAGE: "$CI_REGISTRY_IMAGE"
  TAG: "$CI_COMMIT_SHORT_SHA"
  CONFIG_REPO: "gitlab.com/wilsonsgro/lessons-config.git"

default:
  interruptible: true                 # una push nuova cancella la pipeline vecchia

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-lint:
  stage: lint
  image: alpine/k8s:1.35.9
  script:
    - helm lint chart/ --strict
    - helm template ci chart/ -f chart/values-prod.yaml | kubeconform -strict -summary -

unit-test:
  stage: test
  image: node:24-alpine
  cache:
    key: { files: [yarn.lock] }       # cache invalidata solo se cambia il lock
    paths: [node_modules/]
  script:
    - yarn install --frozen-lockfile
    - yarn test --ci
  artifacts:
    reports:
      junit: junit.xml                # i test falliti compaiono nella MR

build:
  stage: build
  image: moby/buildkit:rootless       # niente docker:dind privilegiato
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - buildctl-daemonless.sh build
        --frontend dockerfile.v0 --local context=. --local dockerfile=.
        --output type=image,name=$IMAGE:$TAG,push=true
        --export-cache type=registry,ref=$IMAGE:cache,mode=max
        --import-cache type=registry,ref=$IMAGE:cache

trivy:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $IMAGE:$TAG

# GitOps: la CI non tocca il cluster, scrive nel repo di configurazione
.aggiorna-config: &aggiorna-config
  image: alpine/k8s:1.35.9
  script:
    - git clone "https://ci:${CONFIG_TOKEN}@${CONFIG_REPO}" config
    - cd config/overlays/$AMBIENTE
    - kustomize edit set image "eco=$IMAGE:$TAG"
    - git -c user.name=ci -c user.email=ci@example.invalid commit -am "eco $TAG → $AMBIENTE"
    - git push origin HEAD:main

deploy-staging:
  stage: deploy-staging
  <<: *aggiorna-config
  variables: { AMBIENTE: staging }
  environment: { name: staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-prod:
  stage: deploy-prod
  <<: *aggiorna-config
  variables: { AMBIENTE: prod }
  environment: { name: production }   # approvazioni e accessi sull'environment protetto
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual                    # promozione = un clic, stessa immagine
  resource_group: production          # mai due deploy prod in parallelo
---
# ── ARGO CD: l'Application che osserva il repo di configurazione ───────────
# In un repo vero è un file a parte (repo di config o di Argo):
# .gitlab-ci.yml deve contenere solo la pipeline.
# Controlli prima della commit, provati su queste due parti:
#   uvx check-jsonschema --builtin-schema vendor.gitlab-ci .gitlab-ci.yml
#   kubectl apply --dry-run=server -f application.yaml   (con i CRD di Argo)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eco-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # cancelli l'App → cancella le risorse
spec:
  project: default
  source:
    repoURL: https://gitlab.com/wilsonsgro/lessons-config.git
    targetRevision: main
    path: overlays/prod               # Argo riconosce Kustomize, Helm o YAML
  destination:
    server: https://kubernetes.default.svc
    namespace: eco-prod
  syncPolicy:
    automated:
      prune: true                     # cancella ciò che non è più in git
      selfHeal: true                  # annulla le modifiche fatte a mano
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }

# ── STRATEGIE DI RILASCIO ───────────────────────────────────────────────────
#   rolling      default del Deployment; rollback = rollout undo / revert
#   blue/green   due versioni complete, si sposta il traffico tutto insieme
#   canary       una percentuale crescente, con analisi delle metriche
#                (Argo Rollouts / Flagger leggono Prometheus e annullano da
#                soli se l'error rate sale)
#   feature flag rilascio del codice separato dall'attivazione
# Il database è il vincolo: migrazioni compatibili all'indietro
# (expand → migrate → contract) o il rollback dell'app rompe tutto.

# ── DOMANDE DA COLLOQUIO ────────────────────────────────────────────────────
# D: Perché non `docker:dind` in CI?
# R: Richiede container privilegiati sul runner: chi controlla la pipeline
#    controlla l'host. BuildKit rootless, Kaniko o Buildah fanno la build
#    senza privilegi.
#
# D: Qualcuno ha fatto `kubectl edit` in produzione. Con GitOps cosa succede?
# R: Argo segna l'App OutOfSync; con selfHeal la riporta allo stato di git
#    entro pochi minuti. La correzione vera passa da una MR.
#
# D: Come fai il rollback in GitOps?
# R: `git revert` della commit di promozione: Argo sincronizza lo stato
#    precedente. Il rollback dell'interfaccia di Argo è d'emergenza:
#    disattiva l'auto-sync e lascia git diverso dal cluster.
#
# D: Dove stanno i segreti della pipeline?
# R: Variabili CI protette e mascherate, meglio ancora OIDC: il job
#    ottiene un token a scadenza (id_tokens di GitLab) e lo scambia con
#    credenziali temporanee del cloud o di Vault. Nessuna chiave statica.

# ══════════════════════════════════════════════════════════════════════════
# RIEPILOGO
# • Push (CI fa helm upgrade) vs Pull/GitOps (Argo CD riconcilia da git)
# • Build once, deploy many: tag = SHA, promozione senza rebuild
# • Build senza privilegi (BuildKit rootless), scan bloccante (Trivy)
# • Argo CD: automated + prune + selfHeal; rollback = git revert
# • Rilasci: rolling, blue/green, canary con analisi; migrazioni expand/contract
# ══════════════════════════════════════════════════════════════════════════
