apiVersion: v1
kind: Namespace
metadata:
  name: lab-metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-metrics-code
  namespace: lab-metrics
data:
  app.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from threading import Lock
    import time

    requests = 0
    duration_sum = 0.0
    lock = Lock()

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            global requests, duration_sum

            if self.path == "/health":
                body = b"ok\n"
                content_type = "text/plain"

            elif self.path == "/work":
                start = time.monotonic()
                time.sleep(0.02)
                elapsed = time.monotonic() - start

                with lock:
                    requests += 1
                    duration_sum += elapsed

                body = b"lavoro completato\n"
                content_type = "text/plain"

            elif self.path == "/metrics":
                with lock:
                    count = requests
                    total = duration_sum

                metrics = (
                    "# HELP demo_requests_total Richieste di lavoro\n"
                    "# TYPE demo_requests_total counter\n"
                    f"demo_requests_total {count}\n"
                    "# HELP demo_request_duration_seconds Durata lavoro\n"
                    "# TYPE demo_request_duration_seconds summary\n"
                    f"demo_request_duration_seconds_sum {total}\n"
                    f"demo_request_duration_seconds_count {count}\n"
                )
                body = metrics.encode()
                content_type = "text/plain; version=0.0.4"

            else:
                body = b"not found\n"
                content_type = "text/plain"
                self.send_response(404)
                self.send_header("Content-Type", content_type)
                self.end_headers()
                self.wfile.write(body)
                return

            self.send_response(200)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-metrics
  namespace: lab-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-metrics
  template:
    metadata:
      labels:
        app: demo-metrics
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - name: metrics
              containerPort: 8000
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: demo-metrics-code
---
apiVersion: v1
kind: Service
metadata:
  name: demo-metrics
  namespace: lab-metrics
  labels:
    app: demo-metrics
spec:
  selector:
    app: demo-metrics
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-metrics
  namespace: lab-metrics
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: demo-metrics
  namespaceSelector:
    matchNames:
      - lab-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
