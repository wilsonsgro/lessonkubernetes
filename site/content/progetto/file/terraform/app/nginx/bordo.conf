# Porte di servizio del pod: 80 rimanda a https (arriva da HAProxy col PROXY protocol), 8081 risponde alle sonde.
server {
    listen 80 proxy_protocol default_server;
    server_name _;
    set_real_ip_from 0.0.0.0/0;
    real_ip_header proxy_protocol;
    return 301 https://$host$request_uri;
}

server {
    listen 8081 default_server;
    server_name _;
    access_log off;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
