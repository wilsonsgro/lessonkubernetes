# Static lessons site: clean URLs, raw sources shown as text, no caching of HTML so a rebuild is seen at once.
server {
    listen 80;
    server_name lessons.kubernates.local;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/javascript application/json image/svg+xml;

    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        text/plain md sh yaml yml txt tf hcl;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    location /fonti/ {
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-cache";
    }
}
