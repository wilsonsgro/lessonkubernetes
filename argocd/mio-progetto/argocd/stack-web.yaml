apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-web
  namespace: argocd
spec:
  project: default

  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/wilson/mio-progetto.git
    targetRevision: HEAD
    path: stack

  destination:
    server: https://kubernetes.default.svc
    namespace: stack-web

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
