apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mio-sito
spec:
  ingressClassName: nginx
  rules:
    - host: mio-sito.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mio-sito
                port:
                  number: 80
